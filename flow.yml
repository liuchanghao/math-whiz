name: math-whiz-ci

sources:
  math_whiz:
    type: gitee
    name: math-whiz
    endpoint: https://gitee.com/lch3320/math-whiz.git
    branch: main
    branchesFilter: main
    triggerEvents:
      - push
    certificate:
      type: serviceConnection
      serviceConnection: ${GITEE_SERVICE_CONNECTION}

stages:
  quality_stage:
    name: 质量门禁
    jobs:
      quality_job:
        name: Node.js 22 检查与构建
        runsOn: public/cn-hangzhou
        steps:
          quality_step:
            step: NodeBuild
            name: 冻结安装并执行完整检查
            with:
              nodeVersion: '22.22.0'
              run: |
                corepack enable
                corepack prepare pnpm@10.33.3 --activate
                pnpm ci:check
                docker run --name math-whiz-test-mysql -e MYSQL_ALLOW_EMPTY_PASSWORD=yes -e MYSQL_DATABASE=math_whiz_test -p 3307:3306 -d mysql:8.4
                until docker exec math-whiz-test-mysql mysqladmin ping --silent; do sleep 2; done
                DATABASE_URL=mysql://root@127.0.0.1:3307/math_whiz_test pnpm --filter @math-whiz/api db:migrate
                TEST_DATABASE_URL=mysql://root@127.0.0.1:3307/math_whiz_test pnpm test:integration
                pnpm exec playwright install --with-deps chromium
                E2E_DATABASE_URL=mysql://root@127.0.0.1:3307/math_whiz_test E2E_ADMIN_USERNAME=math_admin E2E_ADMIN_PASSWORD=integration-only-password-4vPteuKz2S6Dq9Yx pnpm test:e2e
